# 阶段 5:docker-compose.yml(host 网络,生产 192.168.18.156 单机部署)
# bridge 版见 docker-compose.bridge.yml(开发机 192.168.80.101)。
#
# 服务:gateway / ai / scan-engine / graphrag / celery(必启用)
#     preprocessing(按需启用,默认注释)
#     frontend(不变)
#
# 健康检查:
# - gateway/ai/graphrag:HTTP /healthz
# - scan-engine / celery / preprocessing:依赖 depends_on + entrypoint 日志关键字

services:
  gateway:
    build:
      context: ../..
      dockerfile: deployments/prod/docker/Dockerfile.gateway
    image: secagent-gateway:0.1.0
    container_name: secagent-gateway
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      # Nacos 多 dataId(阶段 0-2 nacos_loader 改造支持)
      NACOS_DATA_IDS: "security-agent-shared.yaml,security-agent-gateway.yaml"
      NACOS_NAMESPACE: "prod"
      NACOS_GROUP: "security"
      # uvicorn bind 127.0.0.1 已在 Dockerfile CMD 写死(防绕过鉴权)
      # AI 代理地址(默认指向本机 8001)
      AI_BASE_URL: "http://127.0.0.1:8001"
      GRAPHRAG_BASE_URL: "http://127.0.0.1:8002"
      # 阶段 5 收尾:删 AI_PROXY_ENABLED(反代是唯一路径)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      ai:
        condition: service_healthy
      graphrag:
        condition: service_healthy

  ai:
    build:
      context: ../..
      dockerfile: deployments/prod/docker/Dockerfile.ai
    image: secagent-ai:0.1.0
    container_name: secagent-ai
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      NACOS_DATA_IDS: "security-agent-shared.yaml,security-agent-ai.yaml"
      NACOS_NAMESPACE: "prod"
      NACOS_GROUP: "security"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scan-engine:
    build:
      context: ../..
      dockerfile: deployments/prod/docker/Dockerfile.scan-engine
    image: secagent-scan-engine:0.1.0
    container_name: secagent-scan-engine
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      NACOS_DATA_IDS: "security-agent-shared.yaml,security-agent-scan-engine.yaml"
      NACOS_NAMESPACE: "prod"
      NACOS_GROUP: "security"
      GRAPHRAG_BASE_URL: "http://127.0.0.1:8002"
    volumes:
      # 沙箱需要 docker socket
      - /var/run/docker.sock:/var/run/docker.sock
    # 健康检查:无 HTTP,依赖日志关键字 + pgrep
    # entrypoint-scan-engine.sh 由 Dockerfile.scan-engine 加(阶段 5 收尾)
    # healthcheck 走 docker 内置:pgrep -f scan_engine.main
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'src.scan_engine.main' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      graphrag:
        condition: service_healthy

  asset-scan:
    build:
      context: ../..
      dockerfile: deployments/prod/docker/Dockerfile.asset-scan
    image: secagent-asset-scan:0.1.0
    container_name: secagent-asset-scan
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      NACOS_DATA_IDS: "security-agent-shared.yaml,security-agent-asset-scan.yaml"
      NACOS_NAMESPACE: "prod"
      NACOS_GROUP: "security"
    # 需求②: agentless 扫描需从对目标网段可达的主机发起; 独立容器便于
    # 收敛防火墙规则(仅本服务放行出站扫描)。健康检查走 pgrep。
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'src.asset_scan.main' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  graphrag:
    build:
      context: ../..
      dockerfile: deployments/prod/docker/Dockerfile.graphrag
    image: secagent-graphrag:0.1.0
    container_name: secagent-graphrag
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      NACOS_DATA_IDS: "security-agent-shared.yaml,security-agent-graphrag.yaml"
      NACOS_NAMESPACE: "prod"
      NACOS_GROUP: "security"
      EMBEDDING_MODEL_PATH: "/opt/models/bge-large-zh-v1.5"
    volumes:
      - /opt/models/bge-large-zh-v1.5:/opt/models/bge-large-zh-v1.5:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery:
    build:
      context: ../..
      dockerfile: deployments/prod/docker/Dockerfile.celery
    image: secagent-celery:0.1.0
    container_name: secagent-celery
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      NACOS_DATA_IDS: "security-agent-shared.yaml,security-agent-celery.yaml"
      NACOS_NAMESPACE: "prod"
      NACOS_GROUP: "security"
      REDIS_URL: "redis://127.0.0.1:6379/0"
    # 健康检查:celery inspect ping(celery 启动后才接受 ping)
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.common.celery_app inspect ping -d celery@$(hostname) >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # preprocessing(按需启用,默认注释;生产未启用)
  # preprocessing:
  #   build:
  #     context: ../..
  #     dockerfile: deployments/prod/docker/Dockerfile.preprocessing
  #   image: secagent-preprocessing:0.1.0
  #   container_name: secagent-preprocessing
  #   restart: unless-stopped
  #   network_mode: host
  #   env_file: ../.env
  #   environment:
  #     NACOS_DATA_IDS: "security-agent-shared.yaml,security-agent-preprocessing.yaml"
  #   depends_on:
  #     - scan-engine

  frontend:
    image: secagent-frontend:0.1.0
    container_name: secagent-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    extra_hosts:
      - "secagent-api:127.0.0.1"  # gateway host bind
    depends_on:
      - gateway