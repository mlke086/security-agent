title: SSH Brute Force Attempt
id: ssh-bruteforce-zoo-001
description: Detect repeated SSH authentication failures
level: high
logsource:
  product: linux
  service: sshd
detection:
  selection:
    RuleName|contains: ssh
    Status|contains: failed
  condition: selection
fields:
  - ip
  - hostname
tags:
  - attack.credential_access
  - attack.t1110
